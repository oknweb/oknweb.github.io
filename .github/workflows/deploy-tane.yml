name: Deploy 種の杜 to ロリポップ

on:
  push:
    branches:
      - main
    paths:
      - 'web_works/TaneNoMori-web/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_SERVER: ${{ secrets.TANE_FTP_SERVER }}
          FTP_USER: ${{ secrets.TANE_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.TANE_FTP_PASSWORD }}
        run: |
          lftp -e "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_SERVER\";
            mirror --reverse --delete --verbose \
              --exclude=DEV_NOTES.md \
              --exclude=.git \
              --exclude=node_modules \
              ./web_works/TaneNoMori-web/ ./;
            bye
          "
