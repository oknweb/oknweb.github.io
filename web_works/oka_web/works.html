<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAFAF7">
  <title>Works — Shinichiro Okaniwa Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Shippori+Mincho:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- NAV -->
  <nav id="nav">
    <a href="index.html" class="nav-logo">S. Okaniwa</a>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="works.html">Works</a></li>
      <li><a href="index.html#skills">Skills</a></li>
      <li><a href="index.html#profile">Profile</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="メニュー">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- SPメニュー -->
  <div class="sp-menu" id="spMenu">
    <a href="index.html#about" class="sp-menu-link">About</a>
    <a href="works.html" class="sp-menu-link">Works</a>
    <a href="index.html#skills" class="sp-menu-link">Skills</a>
    <a href="index.html#profile" class="sp-menu-link">Profile</a>
    <a href="index.html#contact" class="sp-menu-link">Contact</a>
  </div>

  <!-- WORKS PAGE HEADER -->
  <section class="works-page-header">
    <div class="works-page-hero">
      <h1 class="works-page-title">Works</h1>
      <p class="works-page-subtitle">制作実績</p>
    </div>
  </section>

  <!-- WORKS CONTENT -->
  <section id="works-page">
    <div class="works-filter reveal">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="web">Web Design</button>
      <button class="filter-btn" data-category="logo">Logo Design</button>
      <button class="filter-btn" data-category="video">Video / Marketing</button>
      <button class="filter-btn" data-category="game">Game Design</button>
    </div>

    <div class="works-all-grid"></div>
  </section>

  <!-- WORK DETAIL MODAL -->
  <div class="work-modal" id="workModal">
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose" aria-label="閉じる">×</button>

      <div class="modal-header">
        <p class="modal-category" id="modalCategory"></p>
        <h2 class="modal-title" id="modalTitle"></h2>
      </div>

      <div class="modal-body">
        <!-- メディア（動画 or 画像） -->
        <div class="modal-media" id="modalMedia"></div>

        <!-- 基本情報 -->
        <div class="modal-section info-section">
          <h3 class="modal-section-title">基本情報</h3>
          <ul class="modal-info-list" id="modalInfo"></ul>
        </div>

        <!-- 概要 -->
        <div class="modal-section overview-section">
          <h3 class="modal-section-title">概要</h3>
          <p class="modal-text" id="modalOverview"></p>
        </div>

        <!-- こだわりポイント -->
        <div class="modal-section points-section">
          <h3 class="modal-section-title">こだわりポイント</h3>
          <p class="modal-text" id="modalPoints"></p>
        </div>

        <!-- 外部リンク -->
        <div class="modal-links" id="modalLinks"></div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p class="footer-copy">© 2025 Shinichiro Okaniwa. All rights reserved.</p>
    <ul class="footer-nav">
      <li><a href="index.html#about">About</a></li>
      <li><a href="works.html">Works</a></li>
      <li><a href="index.html#skills">Skills</a></li>
      <li><a href="index.html#profile">Profile</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <a href="#" class="back-top">
      <div class="back-top-line"></div>
      <span>TOP</span>
    </a>
  </footer>

  <script src="js/works-data.js"></script>
  <script src="js/render-cards.js"></script>
  <script src="js/main.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/modal.js"></script>

</body>

</html>
