<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>創作工房[SEED FOREST]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Hiragino Sans', sans-serif;
            background: #000000;
            color: #FFFFFF;
            overflow-x: hidden;
        }

        .lato-thin {
            font-family: "Lato", sans-serif;
            font-weight: 100;
            font-style: normal;
        }

        .lato-light {
            font-family: "Lato", sans-serif;
            font-weight: 300;
            font-style: normal;
        }

        .lato-regular {
            font-family: "Lato", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        .lato-bold {
            font-family: "Lato", sans-serif;
            font-weight: 700;
            font-style: normal;
        }

        .lato-black {
            font-family: "Lato", sans-serif;
            font-weight: 900;
            font-style: normal;
        }

        .lato-thin-italic {
            font-family: "Lato", sans-serif;
            font-weight: 100;
            font-style: italic;
        }

        .lato-light-italic {
            font-family: "Lato", sans-serif;
            font-weight: 300;
            font-style: italic;
        }

        .lato-regular-italic {
            font-family: "Lato", sans-serif;
            font-weight: 400;
            font-style: italic;
        }

        .lato-bold-italic {
            font-family: "Lato", sans-serif;
            font-weight: 700;
            font-style: italic;
        }

        .lato-black-italic {
            font-family: "Lato", sans-serif;
            font-weight: 900;
            font-style: italic;
        }


        /* ヘッダー */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid #00FF00;
            position: relative;
            z-index: 100;
        }

        header>div {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #00FF00, #00FFFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-small {
            font-size: 16px;
            color: #00FF00;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            gap: 30px;
            align-items: flex-end;
        }

        nav a {
            color: #FFFFFF;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
        }

        nav a:after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: #00FF00;
            transition: width 0.3s ease;
        }

        nav a:hover:after {
            width: 100%;
        }

        .cta-small {
            padding: 8px 20px;
            border: 2px solid #FF6600;
            color: #FF6600;
            background-color: #000000;
            text-decoration: none;
            font-size: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .cta-small:hover {
            background: #FF6600;
            color: #000000;
            box-shadow: 0 0 20px #FF6600;
        }

        /* サイドメニュー */
        .side-menu {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 30px;
            z-index: 50;
        }

        .side-menu-label {
            color: #FF6600;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-weight: bold;
        }

        .side-menu a {
            color: #00FF00;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            transition: all 0.3s ease;
            opacity: 0.8;
            padding: 8px 12px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            display: inline-block;
        }

        .side-menu a:hover {
            opacity: 1;
            filter: drop-shadow(0 0 15px #00FF00);
            border-color: #00FF00;
            background: rgba(0, 255, 0, 0.05);
        }

        /* ファーストビュー */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            align-items: center;
            gap: 40px;
            padding: 60px 40px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(1, 41, 31, 0.8) 0%, rgba(3, 27, 9, 0.5) 100%),
                url(./hero-photo.jpg);
            background-blend-mode: multiply;
            width: 100%;
            height: auto;
            background-size: cover;
            background-position: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(0, 255, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(0, 255, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 10;
        }

        .hero-title {
            font-size: 56px;
            font-weight: bold;
            line-height: 1.3;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .hero-title-sub {
            font-size: 14px;
            color: #00FF00;
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .hero-copy {
            font-size: 18px;
            color: #CCCCCC;
            line-height: 1.8;
            margin-bottom: 50px;
            max-width: 400px;
        }

        .cta-button {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #00FF00, #00FFFF);
            color: #000000;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .cta-button:hover {
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.8);
            transform: translateY(-3px);
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .hero-image {
            position: relative;
            z-index: 10;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(0, 255, 0, 0.4));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .about-link {
            margin-top: 40px;
        }

        .about-link a {
            color: #00FFFF;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 2px;
            border-bottom: 2px solid #00FFFF;
            transition: all 0.3s ease;
            display: inline-block;
            padding-bottom: 5px;
        }

        .about-link a:hover {
            color: #00FF00;
            border-bottom-color: #00FF00;
        }

        /* レスポンシブ */
        @media (max-width: 1024px) {
            .hero {
                grid-template-columns: 1fr;
                padding: 40px 20px;
            }

            .hero-title {
                font-size: 40px;
            }

            .hero-image {
                height: 300px;
            }

            nav {
                gap: 15px;
                font-size: 12px;
            }

            .side-menu {
                display: none;
            }
        }

        @media (max-width: 640px) {
            .hero-title {
                font-size: 28px;
            }

            header {
                flex-direction: column;
                gap: 20px;
                padding: 15px 20px;
            }

            nav {
                gap: 10px;
            }

            .cta-button {
                padding: 12px 30px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <!-- ヘッダー -->
    <header>
        <div>
            <div class="logo">創作工房</div>
            <div class="logo-small">[SEED FOREST]</div>
        </div>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#course">Course</a>
            <a href="#contact">Contact</a>
            <button class="cta-small">お申し込み</button>
        </nav>
    </header>

    <!-- サイドメニュー -->
    <div class="side-menu">
        <div class="side-menu-label">MENU</div>
        <a href="#about">ABOUT</a>
        <a href="#course">COURSE</a>
        <a href="#contact">CONTACT</a>
    </div>

    <!-- ファーストビュー -->
    <section class="hero" id="home">
        <div class="hero-content">
            <div class="hero-title-sub">Creative Workshop</div>
            <h1 class="hero-title">あなたの<br><span style="color: #00FF00;">『こうしたい』</span><br>をかたちにします</h1>
            <p class="hero-copy">
                高度な塗装技術と、あなたの想いが出会う場所。<br>
                プラモデル制作代行で、創作の可能性を広げる。
            </p>
            <button class="cta-button">ご相談・お見積もり</button>
            <div class="about-link">
                <a href="#about">About ↓</a>
            </div>
        </div>

        <!-- <div class="hero-image">
            <img src="./hero-photo.jpg" alt="プラモデル作品">
        </div> -->
    </section>
</body>

</html>
